spring.application.name=demo

# ==================== 日志配置 ====================

# 日志文件存放目录（相对于项目根目录，也支持绝对路径如 /var/log/demo）
logging.file.path=logs

# 日志文件名（不含扩展名，扩展名由 Logback 自动追加 .log）
logging.file.name=${logging.file.path}/${spring.application.name}

# 日志保留天数
logback.max-history=30

# 单个日志文件最大大小
logback.max-file-size=100MB

# 总日志归档大小上限
logback.total-size-cap=3GB

# 日志级别（按包名控制）
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework=WARN

# 控制台日志格式（带颜色）
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:--}){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# 文件日志格式（无颜色，机器友好）
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:--} [%t] %-40.40logger{39} : %m%n%wEx
