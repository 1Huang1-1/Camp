name: Upload Logs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  upload-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - run: ./gradlew test --no-daemon
        continue-on-error: true

      - name: 打包日志
        run: |
          mkdir -p logs
          tar -czf logs-archive.tar.gz logs/

      - uses: actions/upload-artifact@v4
        with:
          name: demo-logs-${{ github.sha }}
          path: logs/
          retention-days: 30

      - name: 推送到 logs-branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan logs-branch
          git rm -rf . > /dev/null 2>&1 || true
          cp -r logs logs-bak && mv logs-bak logs
          git add logs/
          git commit -m "upload logs from ${{ github.sha }}"
          git push origin logs-branch --force